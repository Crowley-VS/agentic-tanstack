packages:
  - apps/*
  - packages/*
  - tools

# Supply chain: never install a version published less than 24h ago.
minimumReleaseAge: 1440

# `pnpm add <pkg>` reuses the catalog version when one exists.
catalogMode: prefer

# Every dependency with an install script must be listed (pnpm 11 fails otherwise).
allowBuilds:
  esbuild: true
  lefthook: true
  nx: true

# graphql 17 is out, but Pothos and Yoga are built for 16: every package gets this one copy.
overrides:
  graphql: 16.14.2

# One version per dependency across the workspace. Pinned exactly where
# compatibility is known to be tight (Nx plugins, TypeScript, Vitest, graphql, pre-1.0 tools).
catalog:
  '@escape.tech/graphql-armor': ^3.2.0
  # exact: a new codegen version can change the committed output (apps/web/src/gql)
  '@graphql-codegen/cli': 7.4.3
  '@graphql-codegen/client-preset': 6.2.0
  '@graphql-eslint/eslint-plugin': ^4.4.1
  '@graphql-typed-document-node/core': ^3.2.0
  '@graphql-yoga/plugin-csrf-prevention': ^3.24.1
  '@graphql-yoga/plugin-disable-introspection': ^2.25.1
  '@nx/eslint': 23.2.1
  '@nx/eslint-plugin': 23.2.1
  '@nx/js': 23.2.1
  '@nx/oxlint': 23.2.1
  '@nx/playwright': 23.2.1
  '@nx/vitest': 23.2.1
  # exact, with playwright: one playwright-core, so one browser revision to install
  '@playwright/test': 1.63.0
  '@pothos/core': ^4.15.1
  '@pothos/plugin-complexity': ^4.2.3
  '@pothos/plugin-dataloader': ^4.4.6
  '@pothos/plugin-drizzle': 0.20.0
  '@pothos/plugin-errors': ^4.9.3
  '@pothos/plugin-relay': ^4.8.1
  '@pothos/plugin-validation': ^4.3.4
  # exact, with tailwindcss: @tailwindcss/vite depends on that exact tailwindcss version
  '@tailwindcss/vite': 4.3.3
  '@tanstack/react-query': ^5.104.0
  # react-start pins react-router exactly: bump both together, or two routers get installed
  # (react-router-ssr-query is from the same release train)
  '@tanstack/react-router': 1.170.40
  '@tanstack/react-router-ssr-query': 1.167.3
  '@tanstack/react-start': 1.168.59
  '@types/node': ^24.19.0
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@typescript-eslint/parser': ^8.70.0
  '@vitejs/plugin-react': ^6.1.1
  # exact, with vitest (its peer range is that exact version)
  '@vitest/browser-playwright': 4.1.11
  class-variance-authority: 0.7.1
  # pre-1.0 and fast-moving; the shadcn registry's components import it
  cn: 0.4.0
  dataloader: ^2.2.3
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  eslint: ^10.11.0
  graphql: 16.14.2
  graphql-yoga: ^5.24.1
  lefthook: ^2.1.14
  lucide-react: ^1.48.0
  next-themes: 0.4.6
  # the only published version (a beta); pinned exactly
  nitro: 3.0.260903-beta
  nx: 23.2.1
  oxfmt: ^0.70.0
  oxlint: ^1.85.0
  oxlint-tsgolint: ^7.0.2003
  pg: ^8.23.0
  # exact, with @playwright/test
  playwright: 1.63.0
  radix-ui: ^1.6.7
  react: ^19.3.0
  react-dom: ^19.3.0
  # exact: the CLI writes the vendored components (packages/ui/src/components)
  shadcn: 4.21.0
  sonner: ^2.0.8
  tailwindcss: 4.3.3
  tsdown: 0.23.0
  tslib: ^2.8.1
  tsx: ^4.23.0
  tw-animate-css: ^1.4.0
  typescript: 6.0.3
  vite: ^8.3.1
  vitest: 4.1.11
  vitest-browser-react: ^2.3.0
  zod: ^4.6.5
