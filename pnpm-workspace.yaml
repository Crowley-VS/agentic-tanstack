packages:
  - apps/*
  - packages/*
  - tools

# Supply chain: never install a version published less than 24h ago.
minimumReleaseAge: 1440

# `pnpm add <pkg>` reuses the catalog version when one exists.
catalogMode: prefer

# Every dependency with an install script must be listed (pnpm 11 fails otherwise).
allowBuilds:
  esbuild: true
  lefthook: true
  nx: true

# One version per dependency across the workspace. Pinned exactly where
# compatibility is known to be tight (see docs/decisions/0002-version-matrix.md).
catalog:
  '@nx/eslint': 23.2.1
  '@nx/eslint-plugin': 23.2.1
  '@nx/js': 23.2.1
  '@nx/oxlint': 23.2.1
  '@nx/vitest': 23.2.1
  '@types/node': ^24.19.0
  '@typescript-eslint/parser': ^8.70.0
  eslint: ^10.11.0
  lefthook: ^2.1.14
  nx: 23.2.1
  oxfmt: ^0.70.0
  oxlint: ^1.85.0
  oxlint-tsgolint: ^7.0.2003
  tslib: ^2.8.1
  typescript: 6.0.3
  vite: ^8.3.1
  vitest: 4.1.11
  zod: ^4.6.5
