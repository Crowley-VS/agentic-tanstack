packages:
  - apps/*
  - packages/*
  - tools

# Supply chain: never install a version published less than 24h ago.
minimumReleaseAge: 1440

# `pnpm add <pkg>` reuses the catalog version when one exists.
catalogMode: prefer

# Every dependency with an install script must be listed (pnpm 11 fails otherwise).
allowBuilds:
  esbuild: true
  lefthook: true
  nx: true

# graphql 17 is out, but Pothos and Yoga are built for 16: every package gets this one copy.
overrides:
  graphql: 16.14.2

# One version per dependency across the workspace. Pinned exactly where
# compatibility is known to be tight (Nx plugins, TypeScript, Vitest, graphql, pre-1.0 tools).
catalog:
  '@escape.tech/graphql-armor': ^3.2.0
  '@graphql-yoga/plugin-csrf-prevention': ^3.24.1
  '@graphql-yoga/plugin-disable-introspection': ^2.25.1
  '@nx/eslint': 23.2.1
  '@nx/eslint-plugin': 23.2.1
  '@nx/js': 23.2.1
  '@nx/oxlint': 23.2.1
  '@nx/vitest': 23.2.1
  '@pothos/core': ^4.15.1
  '@pothos/plugin-complexity': ^4.2.3
  '@pothos/plugin-dataloader': ^4.4.6
  '@pothos/plugin-drizzle': 0.20.0
  '@pothos/plugin-errors': ^4.9.3
  '@pothos/plugin-relay': ^4.8.1
  '@pothos/plugin-validation': ^4.3.4
  '@types/node': ^24.19.0
  '@types/pg': ^8.23.1
  '@typescript-eslint/parser': ^8.70.0
  dataloader: ^2.2.3
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  eslint: ^10.11.0
  graphql: 16.14.2
  graphql-yoga: ^5.24.1
  lefthook: ^2.1.14
  nx: 23.2.1
  oxfmt: ^0.70.0
  oxlint: ^1.85.0
  oxlint-tsgolint: ^7.0.2003
  pg: ^8.23.0
  tsdown: 0.23.0
  tslib: ^2.8.1
  tsx: ^4.23.0
  typescript: 6.0.3
  vite: ^8.3.1
  vitest: 4.1.11
  zod: ^4.6.5
