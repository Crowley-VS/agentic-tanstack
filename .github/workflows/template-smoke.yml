# Template maintenance only: proves a fresh copy bootstraps, passes every check and its end-to-end
# tests, on pull requests, on main and weekly (dependencies move between changes). Runs only where
# the repository variable TEMPLATE_MAINTENANCE is 'true' (the upstream template). Repository
# variables are not copied into repos created from the template, and bootstrap deletes this file
# anyway. docs/maintaining.md has the details.
name: Template smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

env:
  CI: 'true'
  NX_NO_CLOUD: 'true'
  NX_TUI: 'false'

jobs:
  smoke:
    if: vars.TEMPLATE_MAINTENANCE == 'true'
    name: bootstrap (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # archive  = `pnpm dlx giget` / tarball download (no .git, export-ignore applied)
        # template = GitHub "Use this template" (every tracked file, one fresh commit)
        mode: [archive, template]
    steps:
      - uses: actions/checkout@v7

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Git identity for the bootstrap commit
        run: |
          git config --global user.name "Template Smoke"
          git config --global user.email "smoke@example.com"

      - name: Create a fresh copy
        env:
          DEST: ${{ runner.temp }}/copy
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p "$DEST"
          if [ "$MODE" = archive ]; then
            git archive HEAD | tar -x -C "$DEST"
          else
            git ls-files -z | tar --null -T - -cf - | tar -x -C "$DEST"
            cd "$DEST" && git init -q -b main && git add -A && git commit -q -m "Initial commit"
          fi

      # a scope much longer than @acme: lines near the print width must come out formatted; the
      # name the README's quickstart uses (and bootstrap's default)
      - name: Bootstrap
        working-directory: ${{ runner.temp }}/copy
        run: node scripts/bootstrap.mjs --yes --scope @a-much-longer-scope --name my-app

      # bootstrap installs Chromium without its system libraries (that needs sudo)
      - name: Install Playwright Chromium
        working-directory: ${{ runner.temp }}/copy
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: No template leftovers
        working-directory: ${{ runner.temp }}/copy
        run: |
          set -e
          if git grep -nE '@acme/|acme-app'; then echo "placeholders survived bootstrap"; exit 1; fi
          # the Railway config builds the copy's repository: the upstream slug may remain only
          # outside .railway (package.json#template, the README's provenance link)
          upstream=$(node -p "require('./package.json').template?.repo || process.exit(1)")
          if git grep -nF "$upstream" -- .railway; then echo ".railway still builds $upstream"; exit 1; fi
          test ! -e scripts/bootstrap.ts
          test ! -e scripts/bootstrap.mjs
          test ! -e template.json
          # and so are the docs' template-only passages (a marker line, not its name in a sentence)
          if git grep -nE '^\s*<!-- template-only:(start|end) -->\s*$'; then
            echo "template-only passages survived bootstrap"; exit 1
          fi
          # the template's maintenance (docs/maintaining.md) is gone; what a project uses stays
          for f in template-smoke.yml release-please.yml; do
            test ! -e ".github/workflows/$f"
          done
          test ! -e release-please-config.json
          test ! -e .release-please-manifest.json
          test ! -e .prettierignore
          test -e .github/workflows/ci.yml
          test -e .github/workflows/renovate-regen.yml
          test -e .github/renovate.json5
          test "$(git rev-list --count HEAD)" -le 2

      # git archive writes the commit into template.json (export-subst), as GitHub's tarballs do;
      # a "Use this template" copy has no way to know it
      - name: Provenance
        working-directory: ${{ runner.temp }}/copy
        env:
          MODE: ${{ matrix.mode }}
          SOURCE: ${{ github.workspace }}
        run: |
          commit=$(node -p "String(require('./package.json').template.commit)")
          expected=null
          if [ "$MODE" = archive ]; then expected=$(git -C "$SOURCE" rev-parse HEAD); fi
          echo "package.json#template.commit: $commit"
          [ "$commit" = "$expected" ] || { echo "::error::expected the commit $expected"; exit 1; }

      - name: Every check on every project
        working-directory: ${{ runner.temp }}/copy
        run: pnpm check --all

      # the production builds `pnpm check --all` just made, on the copy's e2e ports and database
      - name: End-to-end tests
        working-directory: ${{ runner.temp }}/copy
        run: pnpm nx e2e web-e2e --outputStyle=static

      # the Playwright report and each failed test's trace, screenshot and error context
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-output-${{ matrix.mode }}
          path: ${{ runner.temp }}/copy/apps/*/test-output/
          if-no-files-found: ignore
          retention-days: 14
