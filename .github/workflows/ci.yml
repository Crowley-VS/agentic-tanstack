name: CI

on:
  push:
    branches: [main]
  pull_request:

# nx-set-shas reads earlier workflow runs through the Actions API on pushes to main (it finds the
# last green commit), which needs `actions: read`; with only `contents: read` that call gets a 403.
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  NX_NO_CLOUD: 'true'
  NX_TUI: 'false'

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # Installs the exact Node + pnpm pinned in .prototools.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE/NX_HEAD so `pnpm check` only runs affected projects.
      - uses: nrwl/nx-set-shas@v5

      # Same definition of done as local development and agents.
      - run: pnpm check
