name: CI

on:
  push:
    branches: [main]
  pull_request:

# nx-set-shas reads earlier workflow runs through the Actions API on pushes to main (it finds the
# last green commit), which needs `actions: read`; with only `contents: read` that call gets a 403.
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  NX_NO_CLOUD: 'true'
  NX_TUI: 'false'

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # Installs the exact Node + pnpm pinned in .prototools.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Chromium for the browser tests (test-browser targets) and the e2e tests (web-e2e). Both run
      # headless, which needs only the headless shell and its system libraries. Not cached: the
      # libraries are installed anyway.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
        # ~20 s normally; an apt mirror that stalls would otherwise use up the whole job
        timeout-minutes: 5

      # Sets NX_BASE/NX_HEAD so `pnpm check` only runs affected projects.
      - uses: nrwl/nx-set-shas@v5

      # Same definition of done as local development and agents.
      - run: pnpm check

      # Cache correctness: `pnpm check` just ran (or replayed) these generators and builds, so
      # running them again must replay every task from the cache ("Cache: N/N hit"). A miss means a
      # task changes its own inputs (it writes a file it hashes), so its cache never serves the next
      # run. The builds run here a second time, the generators a third: pnpm check's `generated
      # files` gate runs them first, and that gate is what catches a generator writing its own inputs.
      - name: Generators and builds replay from the cache
        run: |
          set -o pipefail
          pnpm nx affected -t print-schema generate-routes codegen build --outputStyle=static \
            | tee "$RUNNER_TEMP/replay.log"
          awk '{ gsub(/\033\[[0-9;]*m/, "") } /No tasks were run/ { ok = 1 }
            /Cache: +[0-9]+\/[0-9]+ hit/ { split($2, n, "/"); ok = n[1] == n[2] }
            END { exit !ok }' "$RUNNER_TEMP/replay.log" \
            || { echo "::error::a task above missed the Nx cache on its second run"; exit 1; }

      # End-to-end tests when web, api or what they use changed: the production builds `pnpm check`
      # just made (replayed from the cache), on the e2e ports, against a freshly seeded e2e database
      # in the same Docker Postgres. One Nx task per spec file (e2e-ci--<spec>), three at a time,
      # sharing one api and one web server. Nx refuses these atomized tasks without Nx Cloud unless
      # NX_SKIP_ATOMIZER_VALIDATION is set, an internal escape hatch: if an Nx upgrade drops it, run
      # `pnpm nx affected -t e2e` here instead (docs/e2e.md).
      - name: End-to-end tests
        id: e2e
        run: pnpm nx affected -t e2e-ci --parallel=3 --outputStyle=static
        env:
          NX_SKIP_ATOMIZER_VALIDATION: 'true'

      # On an e2e failure: one HTML report merged from the per-spec blob reports (written when CI is
      # set), next to each failed attempt's trace.zip, screenshot and error context. The upload below
      # keeps them; open them with `pnpm exec playwright show-report` / `show-trace`.
      - name: Merge the Playwright reports
        if: failure() && steps.e2e.outcome == 'failure'
        run: pnpm nx run web-e2e:e2e-ci--merge-reports --outputStyle=static
        env:
          PW_MERGE: '1' # the test step already annotated the failures (playwright.config.mts)

      # Keep what failing tests leave in apps/*/test-output/ (the browser tests' screenshots and
      # attachments, see apps/web/vitest.browser.config.ts; the Playwright report and traces in
      # apps/web-e2e/test-output/playwright/): without it a CI-only failure has only the log. Keep it
      # the last step: it covers a failure in any step before it.
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: apps/*/test-output/
          if-no-files-found: ignore
          retention-days: 14

  # The production images (apps/api/Dockerfile, apps/web/Dockerfile) run as a deploy runs them
  # (docker-compose.stack.yml): Postgres 18, the api image's migration on an empty database, the
  # private api, then the web server. The steps of `pnpm nx run web-e2e:e2e-stack`
  # (docs/deployment.md), plus checks of the running images: production mode, not root, the API's
  # secret checked from inside the stack's network, the commit as both servers' version, and a
  # clean exit within 10 s of SIGTERM. Only when web-e2e is affected (web, api or anything they
  # use) or a file only this job reads changed; a skipped run passes. Its own runner, so it runs
  # beside `pnpm check`.
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # what docker compose reads: the stack file and its project, whose `<project>-<service>`
      # names the images (the build below tags them so)
      COMPOSE_FILE: docker-compose.stack.yml
      COMPOSE_PROJECT_NAME: acme-app-stack
      STACK_PROJECT: acme-app-stack
      # the specs write far more than the default 10 notes a minute
      STACK_WRITE_RATE_LIMIT: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # Node and pnpm on the runner: the specs and the seed run from here, not from an image.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      # restore only: the check job saves this same key
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Do the images need a run?
        id: gate
        run: |
          if pnpm nx show projects --affected --projects web-e2e --json | grep -q '"web-e2e"' ||
            git diff --name-only "$NX_BASE" "$NX_HEAD" |
              grep -qxE '\.dockerignore|docker-compose\.stack\.yml|\.github/workflows/ci\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::web-e2e is not affected: the images are not built"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      # The three images in one BuildKit run, so their shared build stage (pnpm fetch, the offline
      # install) runs once (migrate is the api image under its own name). Each tag is the name
      # compose gives the service's image, so `up --no-build` finds them. Layers come from the
      # GitHub Actions cache, which only a push (to main: `on:` above) writes (mode=max, about
      # 390 MB per image): pull requests read main's and never evict it with their own.
      # RAILWAY_GIT_COMMIT_SHA is the build argument Railway gives its builds.
      - name: Build the images
        if: steps.gate.outputs.run == 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.stack.yml
          targets: api,migrate,web
          load: true
          set: |
            api.tags=acme-app-stack-api
            migrate.tags=acme-app-stack-migrate
            web.tags=acme-app-stack-web
            *.args.RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}
            api.cache-from=type=gha,scope=api
            migrate.cache-from=type=gha,scope=api
            web.cache-from=type=gha,scope=web
            ${{ github.event_name == 'push' && 'api.cache-to=type=gha,scope=api,mode=max' || '' }}
            ${{ github.event_name == 'push' && 'web.cache-to=type=gha,scope=web,mode=max' || '' }}

      - name: Install Playwright Chromium
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
        timeout-minutes: 5

      # Postgres, the migration (exits 0), the api, then web: --wait returns once each is healthy,
      # or fails on the first that is not. A random secret, not the file's local test value.
      - name: Start the stack
        id: stack
        if: steps.gate.outputs.run == 'true'
        run: |
          secret=$(node -p "require('node:crypto').randomBytes(32).toString('hex')")
          echo "::add-mask::$secret"
          STACK_INTERNAL_API_SECRET=$secret docker compose up --detach --wait --wait-timeout 120 --no-build
          docker compose ps --all

      # The images set NODE_ENV=production: only then does the API enforce its secret.
      - name: The API runs in production mode
        if: steps.gate.outputs.run == 'true'
        run: |
          docker compose logs api | grep -F '(production)' ||
            { echo "::error::the api did not start in production mode"; exit 1; }

      # The images' processes, not only their configured user: PID 1 must not be root.
      - name: The images run as non-root
        if: steps.gate.outputs.run == 'true'
        run: |
          for service in api web; do
            uid=$(docker compose exec -T "$service" grep '^Uid:' /proc/1/status | awk '{ print $2 }')
            echo "$service: PID 1 runs as uid $uid"
            if [ "$uid" = 0 ]; then echo "::error::$service runs as root"; exit 1; fi
          done

      # The api publishes no port (private, as on a platform): ask it from the web container,
      # without the secret (401) and with the web server's own (200). The header is SECRET_HEADER
      # (packages/validators/src/internal-api.ts).
      - name: The API refuses a caller without the secret
        if: steps.gate.outputs.run == 'true'
        run: |
          docker compose exec -T web node -e '
            const ask = (headers) =>
              fetch("http://api:4000/graphql", {
                method: "POST",
                headers: { "content-type": "application/json", ...headers },
                body: JSON.stringify({ query: "{ apiVersion }" }),
              }).then((response) => response.status);
            const secret = { "x-internal-secret": process.env.INTERNAL_API_SECRET };
            Promise.all([ask({}), ask(secret)]).then(([without, withIt]) => {
              console.log("api: " + without + " without the secret, " + withIt + " with it");
              process.exit(without === 401 && withIt === 200 ? 0 : 1);
            });
          ' || { echo "::error::the api must answer 401 without the secret, 200 with it"; exit 1; }

      # Both images baked in RAILWAY_GIT_COMMIT_SHA (the build above passes the commit, as Railway
      # does): the web server's /api/health must answer it as its version, and the browser's way to
      # the API, the web server's BFF, as apiVersion.
      - name: Both servers report the commit as their version
        if: steps.gate.outputs.run == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          web="http://$(docker compose port web 3000)"
          health=$(curl --fail --silent --show-error "$web/api/health")
          echo "web: $health"
          [ "$health" = "{\"status\":\"ok\",\"version\":\"$SHA\"}" ] ||
            { echo "::error::the web server's version is not the commit $SHA"; exit 1; }
          answer=$(curl --fail --silent --show-error --header 'content-type: application/json' \
            --data '{"query":"{ apiVersion }"}' "$web/api/graphql")
          echo "BFF: $answer"
          [ "$answer" = "{\"data\":{\"apiVersion\":\"$SHA\"}}" ] ||
            { echo "::error::apiVersion is not the commit $SHA"; exit 1; }

      # The deterministic seed, from here: dev-only code stays out of the images. The api migrated
      # this database itself; the seed only replaces its rows.
      - name: Seed the stack's database
        if: steps.gate.outputs.run == 'true'
        run: |
          DATABASE_URL="postgresql://app:app@$(docker compose port db 5432)/app" \
            pnpm nx run db:db-seed --excludeTaskDependencies --outputStyle=static

      # Every deploy runs the migrations first: on a database they already migrated they must do
      # nothing, exit 0 and keep its rows (seed.spec reads the seed next).
      - name: The migrations run again
        if: steps.gate.outputs.run == 'true'
        run: docker compose run --rm -T migrate

      # Every spec, in one Playwright run against the containers. E2E_REQUIRE_STACK=1: a spec that
      # needs the seed fails rather than skips. With no API_URL the API's 401 spec skips (the step
      # above checks it).
      - name: End-to-end tests against the images
        id: e2e
        if: steps.gate.outputs.run == 'true'
        run: |
          export BASE_URL="http://$(docker compose port web 3000)"
          E2E_SEEDED=1 E2E_REQUIRE_STACK=1 \
            pnpm nx run web-e2e:e2e-base-url --outputStyle=static -- --workers=3

      # A deploy stops the old container with SIGTERM, then kills it after a grace period (Docker's
      # here: 10 s). Each server must close by itself before that, with exit code 0. Runs after a
      # failed e2e step too.
      - name: The images stop on SIGTERM within 10 s
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          for service in web api; do
            container=$(docker compose ps --quiet "$service")
            start=$(date +%s%N)
            docker compose stop --timeout 10 "$service"
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            code=$(docker inspect --format '{{.State.ExitCode}}' "$container")
            echo "$service: stopped ${ms} ms after SIGTERM, exit code $code"
            if [ "$code" != 0 ] || [ "$ms" -ge 10000 ]; then
              echo "::error::$service did not stop cleanly within 10 s of SIGTERM"; exit 1
            fi
          done

      - name: Stack logs
        if: ${{ failure() && steps.gate.outputs.run == 'true' }}
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      # The Playwright report and each failed test's trace, screenshot and error context.
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-test-output
          path: apps/web-e2e/test-output/
          if-no-files-found: ignore
          retention-days: 14
