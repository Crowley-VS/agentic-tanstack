name: CI

on:
  push:
    branches: [main]
  pull_request:

# nx-set-shas reads earlier workflow runs through the Actions API on pushes to main (it finds the
# last green commit), which needs `actions: read`; with only `contents: read` that call gets a 403.
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  NX_NO_CLOUD: 'true'
  NX_TUI: 'false'

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # Installs the exact Node + pnpm pinned in .prototools.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Chromium for the browser tests (test-browser targets). They run headless, which needs only
      # the headless shell and its system libraries. Not cached: the libraries are installed anyway.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Sets NX_BASE/NX_HEAD so `pnpm check` only runs affected projects.
      - uses: nrwl/nx-set-shas@v5

      # Same definition of done as local development and agents.
      - run: pnpm check

      # Cache correctness: `pnpm check` just ran (or replayed) these generators and builds, so
      # running them again must replay every task from the cache ("Cache: N/N hit"). A miss means a
      # task changes its own inputs (it writes a file it hashes), so its cache never serves the next
      # run. The builds run here a second time, the generators a third: pnpm check's `generated
      # files` gate runs them first, and that gate is what catches a generator writing its own inputs.
      - name: Generators and builds replay from the cache
        run: |
          set -o pipefail
          pnpm nx affected -t print-schema generate-routes codegen build --outputStyle=static \
            | tee "$RUNNER_TEMP/replay.log"
          awk '{ gsub(/\033\[[0-9;]*m/, "") } /No tasks were run/ { ok = 1 }
            /Cache: +[0-9]+\/[0-9]+ hit/ { split($2, n, "/"); ok = n[1] == n[2] }
            END { exit !ok }' "$RUNNER_TEMP/replay.log" \
            || { echo "::error::a task above missed the Nx cache on its second run"; exit 1; }

      # Keep what failing tests leave in apps/*/test-output/ (the browser tests' screenshots and
      # attachments, see apps/web/vitest.browser.config.ts): without it a CI-only failure has only
      # the log. Keep it the last step: it covers a failure in any step before it.
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: apps/*/test-output/
          if-no-files-found: ignore
          retention-days: 14
