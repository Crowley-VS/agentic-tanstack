# Local Postgres for dev, e2e and tests. NOT used in production (Railway runs Postgres 18).
# One compose project per checkout/worktree (name + port from tools/dev-ports.mjs), started by
# `pnpm db:up` / the db:db-up target, which also skips Docker when the server already answers.
services:
  postgres:
    # Debian (glibc) image, not alpine: musl sorts text like C ('B' < 'a'), unlike managed Postgres.
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # PG18 images keep data in /var/lib/postgresql/18/docker: mount the parent, not .../data.
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    # Throwaway local data: trade durability for speed (tests create and drop many databases).
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
      - -c
      - cluster_name=${COMPOSE_PROJECT_NAME:-app}
    shm_size: 256mb
    healthcheck:
      # -h 127.0.0.1: during init a temporary server answers on the unix socket only.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 200ms

volumes:
  pgdata:
